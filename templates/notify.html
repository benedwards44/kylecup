{% extends 'base.html' %}

{% block layout %}
<section>
  <div class="overflow-hidden rounded-lg bg-white shadow">
    <div class="p-6">
<div class="border-b border-blue-900 pb-4">
  <h1 class="text-3xl font-bold">Send Notification</h1>
</div>
<div class="mt-5">
  {% if success %}
  <div class="rounded-md bg-green-50 p-4 mb-6">
    <div class="flex">
      <div class="shrink-0">
        <svg class="size-5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="ml-3">
        <p class="text-sm font-medium text-green-800">Notification sent to {{ device_count }} device{{ device_count|pluralize }}.</p>
      </div>
    </div>
  </div>
  {% endif %}

  {% if error %}
  <div class="rounded-md bg-red-50 p-4 mb-6">
    <div class="flex">
      <div class="shrink-0">
        <svg class="size-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="ml-3">
        <p class="text-sm font-medium text-red-800">{{ error }}</p>
      </div>
    </div>
  </div>
  {% endif %}

  <form method="post" action="{% url 'notify' %}" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
      <input type="text" name="title" id="title" required value="{{ form_data.title|default:'' }}"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:outline-none sm:text-sm" />
    </div>
    <div>
      <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
      <textarea name="message" id="message" rows="5" required
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 shadow-sm focus:border-blue-500 focus:ring-blue-500 focus:outline-none sm:text-sm">{{ form_data.message|default:'' }}</textarea>
    </div>
    <div>
      <button type="submit"
        class="rounded-md bg-blue-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-900">
        Send Notification
      </button>
    </div>
  </form>
</div>
    </div>
  </div>
</section>
{% endblock %}
